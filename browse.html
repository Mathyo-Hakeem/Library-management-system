<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Browse Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">LMS</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Browse Books</h2>
        <input type="text" class="form-control mb-3" placeholder="Search books...">

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Catagory</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Example Book</td>
                    <td>Author Name</td>
                    <td>Fiction</td>
                    <td>Available</td>
                    <td><button class="btn btn-primary">Borrow</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        &copy; 2026 Australian University LMS
    </footer>
</body>

</html>
